name: Madar Release CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q madar-v16-a01-PARTIAL_NOT_RELEASE_READY.zip -d work
          ROOT="$(dirname "$(find work -name gradlew -type f -print -quit)")"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          chmod +x "$ROOT/gradlew"
          echo "Project root: $ROOT"

      - name: Baseline A01 closeout verifier
        id: a01_closeout
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: python3 tools/verify_release_closeout.py

      - name: Apply verified compile repairs
        id: compile_repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/ci/apply_madar_compile_fixes.py" "$PROJECT_ROOT"

      - name: Module graph verifier
        id: module_graph
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: python3 tools/verify_module_graph.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure live Madar backend
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PROJECT_ROOT/local.properties" <<'EOF'
          sdk.dir=__ANDROID_HOME__
          SUPABASE_URL=https://sqicqwzygskzawpytnof.supabase.co
          SUPABASE_KEY=sb_publishable_bvc-mE5f73oQ30i_Jh5hHQ_tTsavUTS
          SENTRY_DSN=
          EOF
          sed -i "s|__ANDROID_HOME__|${ANDROID_HOME}|" "$PROJECT_ROOT/local.properties"

      - name: Generate ephemeral release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$PROJECT_ROOT/madar-ci-release.jks" \
            -storepass 'madar-ci-2026' \
            -alias madar-ci \
            -keypass 'madar-ci-2026' \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=Madar CI, OU=CI, O=Madar, L=Khartoum, ST=Khartoum, C=SD'
          cat > "$PROJECT_ROOT/keystore.properties" <<'EOF'
          storeFile=madar-ci-release.jks
          storePassword=madar-ci-2026
          keyAlias=madar-ci
          keyPassword=madar-ci-2026
          EOF

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew --no-daemon --stacktrace test

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew --no-daemon --stacktrace lint

      - name: Enable KVM
        id: kvm
        continue-on-error: true
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests
        id: instrumentation
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: ${{ env.PROJECT_ROOT }}
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Build release APK
        id: release_build
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect reports and APK
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/reports ci-output/apk
          find "$PROJECT_ROOT" -path '*/build/reports/*' -type f -exec cp --parents {} ci-output/reports/ \; || true
          find "$PROJECT_ROOT" -path '*/build/test-results/*' -type f -exec cp --parents {} ci-output/reports/ \; || true
          find "$PROJECT_ROOT" -path '*/build/outputs/androidTest-results/*' -type f -exec cp --parents {} ci-output/reports/ \; || true
          find "$PROJECT_ROOT" -path '*/build/outputs/apk/release/*.apk' -type f -exec cp {} ci-output/apk/ \; || true
          if compgen -G 'ci-output/apk/*.apk' > /dev/null; then
            sha256sum ci-output/apk/*.apk | tee ci-output/APK_SHA256.txt
          fi
          cat > ci-output/PATCH_APPLIED.txt <<'EOF'
          Verified compile repairs applied after extracting the owner-provided ZIP. Repairs address compile/DI/source-contract blockers only; business acceptance failures are retained in test results.
          EOF
          cat > ci-output/STEP_OUTCOMES.txt <<EOF
          a01_closeout=${{ steps.a01_closeout.outcome }}
          compile_repairs=${{ steps.compile_repairs.outcome }}
          module_graph=${{ steps.module_graph.outcome }}
          unit_tests=${{ steps.unit_tests.outcome }}
          lint=${{ steps.lint.outcome }}
          kvm=${{ steps.kvm.outcome }}
          instrumentation=${{ steps.instrumentation.outcome }}
          release_build=${{ steps.release_build.outcome }}
          EOF
          cat ci-output/STEP_OUTCOMES.txt

      - name: Upload release APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madar-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/
          if-no-files-found: error
          retention-days: 14

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "Unit=${{ steps.unit_tests.outcome }} Lint=${{ steps.lint.outcome }} Instrumentation=${{ steps.instrumentation.outcome }} Release=${{ steps.release_build.outcome }}"
          test "${{ steps.release_build.outcome }}" = success
