name: Madar Release CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q madar-v16-a01-PARTIAL_NOT_RELEASE_READY.zip -d work
          ROOT="$(dirname "$(find work -name gradlew -type f -print -quit)")"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          chmod +x "$ROOT/gradlew"
          echo "Project root: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure CI-only backend values
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PROJECT_ROOT/local.properties" <<EOF
          sdk.dir=${ANDROID_HOME}
          SUPABASE_URL=https://ci-placeholder.supabase.co
          SUPABASE_KEY=ci-placeholder-public-anon-key
          SENTRY_DSN=
          EOF

      - name: Generate ephemeral release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$PROJECT_ROOT/madar-ci-release.jks" \
            -storepass 'madar-ci-2026' \
            -alias madar-ci \
            -keypass 'madar-ci-2026' \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=Madar CI, OU=CI, O=Madar, L=Khartoum, ST=Khartoum, C=SD'
          cat > "$PROJECT_ROOT/keystore.properties" <<EOF
          storeFile=madar-ci-release.jks
          storePassword=madar-ci-2026
          keyAlias=madar-ci
          keyPassword=madar-ci-2026
          EOF

      - name: Module graph verifier
        id: module_graph
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: python3 tools/verify_module_graph.py

      - name: A01 closeout verifier
        id: a01_closeout
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set +e
          python3 tools/verify_release_closeout.py
          rc=$?
          echo "verifier_exit=$rc"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then exit 0; fi
          exit "$rc"

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew --no-daemon --stacktrace test

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew --no-daemon --stacktrace lint

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests
        id: instrumentation
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: ${{ env.PROJECT_ROOT }}
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Build release APK
        id: release_build
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect reports and APK
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output/reports ci-output/apk
          ROOT="${PROJECT_ROOT:-}"
          if [ -n "$ROOT" ] && [ -d "$ROOT" ]; then
            find "$ROOT" -path '*/build/reports/*' -type f -exec cp --parents {} ci-output/reports/ \; || true
            find "$ROOT" -path '*/build/outputs/apk/release/*.apk' -type f -exec cp {} ci-output/apk/ \; || true
          fi
          if compgen -G 'ci-output/apk/*.apk' > /dev/null; then
            sha256sum ci-output/apk/*.apk | tee ci-output/APK_SHA256.txt
          fi
          cat > ci-output/STEP_OUTCOMES.txt <<EOF
          module_graph=${{ steps.module_graph.outcome }}
          a01_closeout=${{ steps.a01_closeout.outcome }}
          unit_tests=${{ steps.unit_tests.outcome }}
          lint=${{ steps.lint.outcome }}
          instrumentation=${{ steps.instrumentation.outcome }}
          release_build=${{ steps.release_build.outcome }}
          EOF
          cat ci-output/STEP_OUTCOMES.txt

      - name: Upload release APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madar-release-ci
          path: ci-output/
          if-no-files-found: error
          retention-days: 14

      - name: Final quality gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.module_graph.outcome }}" = success
          test "${{ steps.a01_closeout.outcome }}" = success
          test "${{ steps.unit_tests.outcome }}" = success
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.instrumentation.outcome }}" = success
          test "${{ steps.release_build.outcome }}" = success
